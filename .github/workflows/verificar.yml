name: Verificar API y demostración
on:
  push:
    branches: [main, cierre-entrega-y-demo, demo-completamente-csharp]
  pull_request:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore TurnosLavadero.slnx
      - run: dotnet build TurnosLavadero.slnx --no-restore
      - run: dotnet test TurnosLavadero.slnx --no-build --logger trx --results-directory TestResults
      - run: dotnet run --no-build --project tools/DemoRunner -- --output TestResults/demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verificacion-y-demo
          path: TestResults/
